upstream rosita_cluster {
    zone rosita_cluster 64k;
    server 172.30.21.11:4000 max_fails=2 fail_timeout=10s;
    server 172.30.21.12:4000 max_fails=2 fail_timeout=10s;
    server 172.30.21.13:4000 max_fails=2 fail_timeout=10s;
}

server {
    listen 80;

    location / {
        proxy_pass http://rosita_cluster;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        proxy_next_upstream error timeout http_502 http_503;
    }
}
