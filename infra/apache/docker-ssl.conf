LoadModule ssl_module modules/mod_ssl.so
Listen 443

<VirtualHost *:80>
    ServerName rosita.local
    Redirect permanent / https://rosita.local/
</VirtualHost>

<VirtualHost *:443>
    ServerName rosita.local
    DocumentRoot /usr/local/apache2/htdocs

    SSLEngine on
    SSLCertificateFile /usr/local/apache2/conf/certs/rosita.local.pem
    SSLCertificateKeyFile /usr/local/apache2/conf/certs/rosita.local-key.pem

    ProxyPreserveHost On
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
